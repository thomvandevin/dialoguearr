<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dialoguearr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2213%22%3E%F0%9F%94%8A%3C/text%3E%3C/svg%3E">
<style>
  /* Palette mirrors the Glance dashboard so this does not read as a separate app. */
  :root {
    --bg: hsl(225 14% 15%); --panel: hsl(225 14% 19%); --line: hsl(225 14% 26%);
    --fg: hsl(225 14% 92%); --dim: hsl(225 10% 62%);
    --primary: hsl(25 89% 62%); --neg: hsl(359 68% 61%); --pos: hsl(145 45% 55%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--primary); }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 22px; }
  header .meta { color: var(--dim); font-size: 13px; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .card .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .card.neg .n { color: var(--neg); } .card.pos .n { color: var(--pos); }
  .status { margin: 22px 0; background: var(--panel); border: 1px solid var(--line);
            border-radius: 8px; padding: 14px 16px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; margin-right: 7px; }
  .dot.live { background: var(--primary); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  nav { display: flex; gap: 6px; margin: 26px 0 14px; flex-wrap: wrap; }
  nav button { background: transparent; border: 1px solid var(--line); color: var(--dim);
               padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  nav button.on { background: var(--primary); border-color: var(--primary); color: hsl(225 14% 12%); font-weight: 600; }
  input[type=search] { background: var(--panel); border: 1px solid var(--line); color: var(--fg);
                       padding: 7px 12px; border-radius: 6px; font-size: 13px; min-width: 220px; }
  .scroll { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 8px; }
  .scroll.free { max-height: none; overflow: visible; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 13px; }
  th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { text-align: left; background: var(--panel); color: var(--dim); font-weight: 600;
       padding: 9px 12px; border-bottom: 1px solid var(--line); text-transform: uppercase;
       font-size: 11px; letter-spacing: .05em; position: sticky; top: 0; }
  td { padding: 8px 12px; border-bottom: 1px solid hsl(225 14% 22%); }
  th:last-child, td:last-child { padding-right: 18px; }
  tr:last-child td { border-bottom: 0; }
  td.name { white-space: normal; overflow-wrap: anywhere; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: hsl(225 14% 26%); color: var(--fg); }
  .tag.done { background: hsl(145 35% 26%); color: hsl(145 60% 82%); }
  .tag.eligible { background: hsl(25 50% 28%); color: hsl(25 85% 80%); }
  .tag.failed, .tag.aborted { background: hsl(359 40% 30%); color: hsl(359 75% 84%); }
  .tag.replaced { background: hsl(145 35% 26%); color: hsl(145 60% 82%); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 26px; text-align: center; color: var(--dim); }
  footer { margin-top: 30px; color: var(--dim); font-size: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .btn { background: var(--panel); border: 1px solid var(--line); color: var(--fg);
         padding: 7px 13px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.warn { color: var(--neg); } .btn.tiny { padding: 3px 8px; font-size: 11px; }
  .setgroup { margin: 0; padding: 18px 16px 6px; }
  .setgroup + .setgroup { border-top: 1px solid var(--line); }
  .setgroup h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--dim); margin: 0 0 12px; }
  .setrow { display: grid; grid-template-columns: 210px 160px 1fr auto; gap: 12px;
            align-items: center; padding: 9px 12px; border-bottom: 1px solid hsl(225 14% 22%); }
  .setrow:last-child { border-bottom: 0; }
  .setrow .key { font-weight: 600; font-size: 13px; }
  .setrow .help { color: var(--dim); font-size: 12px; }
  .setrow input { background: var(--bg); border: 1px solid var(--line); color: var(--fg);
                  padding: 6px 9px; border-radius: 5px; width: 100%; font-size: 13px; }
  .setrow.over .key::after { content: " override"; color: var(--primary); font-size: 10px;
                             text-transform: uppercase; letter-spacing: .05em; }
  .envnote { color: var(--dim); font-size: 11px; }
  .switch { display: inline-flex; align-items: center; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch span { width: 40px; height: 22px; border-radius: 11px; background: var(--line);
                 position: relative; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                        border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
  .switch input:checked + span { background: hsl(25 60% 34%); }
  .switch input:checked + span::after { transform: translateX(18px); background: var(--primary); }
  .repo { margin-left: auto; color: var(--dim); display: inline-flex; align-items: center; }
  .repo:hover { color: var(--primary); }
  .repo svg { width: 22px; height: 22px; fill: currentColor; display: block; }
  h1 { cursor: pointer; }
  .hitrow { fill: transparent; }
  .hitrow:hover + .rowline { stroke-width: 3; }
  .banner { background: hsl(25 50% 22%); border: 1px solid hsl(25 60% 38%); color: hsl(25 90% 84%);
            padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
  svg text { fill: var(--dim); font-size: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home" title="Back to files">dialogue<span>arr</span></h1>
    <div class="meta" id="meta"></div>
    <a class="repo" href="https://github.com/thomvandevin/dialoguearr" target="_blank"
       rel="noopener" title="View on GitHub" aria-label="View on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>

  <div class="cards" id="cards"></div>

  <div class="status">
    <div><span class="dot" id="dot"></span><strong id="stage">idle</strong></div>
    <div class="meta" id="current"></div>
    <div class="meta" id="queue"></div>
  </div>

  <nav>
    <button data-view="files" class="on">Files</button>
    <button data-view="runs">History</button>
    <button data-view="settings">Settings</button>
    <button data-view="chart">Chart</button>
    <input type="search" id="q" placeholder="filter by name">
    <span class="actions">
      <button class="btn" id="btn-scan">Scan now</button>
      <button class="btn" id="btn-pause">Pause</button>
      <button class="btn warn" id="btn-retry" style="display:none">Retry failed</button>
    </span>
  </nav>
  <div id="banner"></div>

  <div class="scroll"><div id="table"></div></div>
  <footer><span id="foot"></span> <span id="ver" class="envnote" style="float:right"></span></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let view = "files";

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d = 1) => v === null || v === undefined ? "" : Number(v).toFixed(d);
const ago = (iso) => {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};

async function get(url) { const r = await fetch(url); return r.json(); }

async function loadSummary() {
  const s = await get("/api/summary");
  const langs = Object.entries(s.by_language || {}).map(([k, v]) => `${k} ${v}`).join(" · ");
  $("cards").innerHTML = `
    <div class="card pos"><div class="n">${s.done}</div><div class="k">processed</div></div>
    <div class="card"><div class="n">${s.eligible}</div><div class="k">eligible</div></div>
    <div class="card"><div class="n">${s.skipped}</div><div class="k">skipped</div></div>
    <div class="card ${s.failures_total ? "neg" : ""}"><div class="n">${s.failures_total}</div><div class="k">failures</div></div>
    <div class="card"><div class="n">${s.avg_gain_db !== null ? "+" + s.avg_gain_db + " dB" : "n/a"}</div><div class="k">avg gain</div></div>
    <div class="card"><div class="n">${s.replaced_7d}</div><div class="k">last 7 days</div></div>`;
  $("meta").textContent = langs ? "languages: " + langs : "";
  $("btn-retry").style.display = s.failures_total > 0 ? "" : "none";
  $("btn-retry").textContent = `Retry ${s.failures_total} failed`;
}

async function loadStatus() {
  const s = await get("/api/status");
  const busy = s.current && s.current.name;
  $("dot").className = "dot" + (busy ? " live" : "");
  $("stage").textContent = busy ? s.current.stage : "idle";
  $("current").textContent = busy ? s.current.name : "";
  TARGET = s.target_lufs;
  $("btn-pause").textContent = s.paused ? "Resume" : "Pause";
  $("ver").textContent = "build " + (s.version || "dev").slice(0, 7);
  $("queue").textContent =
    `${s.queued} queued · window ${s.window} ${s.in_window ? "(open)" : "(closed)"} · target ${s.target_lufs} LUFS · ${s.preferred_languages.join(",") || "file default"}`;
}

function filesTable(rows) {
  if (!rows.length) return `<div class="empty">Nothing to show yet.</div>`;
  return `<table>
    <colgroup><col style="width:30%"><col style="width:7%"><col style="width:8%">
      <col style="width:8%"><col style="width:6%"><col style="width:6%"><col style="width:6%">
      <col style="width:8%"><col style="width:8%"><col style="width:13%"></colgroup>
    <thead><tr>
      <th>File</th><th>State</th><th>Lang</th><th>Source</th>
      <th class="num">In</th><th class="num">Out</th><th class="num">Gain</th>
      <th>Mode</th><th>When</th><th></th></tr></thead><tbody>` +
    rows.map(r => {
      const gain = (r.input_i != null && r.output_i != null) ? "+" + num(r.output_i - r.input_i) : "";
      return `<tr>
        <td class="name">${esc(r.name)}${r.skip_reason ? `<br><span class="meta" style="color:var(--dim);font-size:11px">${esc(r.skip_reason)}</span>` : ""}</td>
        <td><span class="tag ${esc(r.state)}">${esc(r.state)}</span></td>
        <td>${r.source_lang ? esc(r.source_lang) : "<span style='color:var(--dim)'>untagged</span>"}</td>
        <td>${esc(r.source_codec || "")} ${r.source_channels ? r.source_channels + "ch" : ""}</td>
        <td class="num">${num(r.input_i)}</td>
        <td class="num">${num(r.output_i)}</td>
        <td class="num">${gain}</td>
        <td>${esc((r.mode || "").replace("two-pass", "2-pass").replace("single-pass", "1-pass"))}${r.measurement === "sampled" ? " <span class='tag' title='sampled, not a full-file measurement'>~</span>" : ""}</td>
        <td>${ago(r.processed_at || r.updated_at)}</td>
        <td><button class="btn tiny" onclick="reprocess('${esc(r.path)}')">redo</button>
            <button class="btn tiny warn" onclick="exclude('${esc(r.path)}', ${r.excluded ? 0 : 1})">${r.excluded ? "include" : "exclude"}</button></td></tr>`;
    }).join("") + "</tbody></table>";
}

function runsTable(rows) {
  if (!rows.length) return `<div class="empty">No runs recorded yet.</div>`;
  return `<table>
    <colgroup><col style="width:34%"><col style="width:10%"><col style="width:9%">
      <col style="width:9%"><col style="width:7%"><col style="width:21%"><col style="width:10%"></colgroup>
    <thead><tr>
      <th>File</th><th>Outcome</th><th>Trigger</th><th>Mode</th>
      <th class="num">Took</th><th>Detail</th><th>When</th></tr></thead><tbody>` +
    rows.map(r => `<tr>
        <td class="name">${esc(r.name)}</td>
        <td><span class="tag ${esc(r.outcome)}">${esc(r.outcome)}</span></td>
        <td>${esc(r.trigger || "")}</td>
        <td>${esc(r.mode || "")}</td>
        <td class="num">${r.seconds ? Math.round(r.seconds / 60) + "m" : ""}</td>
        <td>${esc(r.detail || "")}</td>
        <td>${ago(r.started_at)}</td></tr>`).join("") + "</tbody></table>";
}

function settingsView(rows) {
  const groups = {};
  rows.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
  return Object.entries(groups).map(([g, items]) => `
    <div class="setgroup"><h3>${esc(g)}</h3>` +
    items.map(r => `
      <div class="setrow ${r.overridden ? "on over" : ""}">
        <div><div class="key">${esc(r.key)}</div>
             <div class="envnote">${r.env_var ? esc(r.env_var) : "runtime only"}</div></div>
        <div>${r.type === "bool"
          ? `<label class="switch"><input type="checkbox" id="set-${esc(r.key)}" data-bool="1"
               ${r.value ? "checked" : ""} onchange="saveSetting('${esc(r.key)}')"><span></span></label>`
          : `<input id="set-${esc(r.key)}" value="${r.override ?? (r.value ?? "")}"
               placeholder="${r.env_value ?? "unset"}">`}</div>
        <div class="help">${esc(r.help)}${r.overridden ? ` <span class="envnote">(compose says ${esc(String(r.env_value))})</span>` : ""}</div>
        <div>${r.type === "bool" ? "" : `<button class="btn tiny" onclick="saveSetting('${esc(r.key)}')">save</button>`}
             ${r.overridden ? `<button class="btn tiny warn" onclick="resetSetting('${esc(r.key)}')">reset</button>` : ""}</div>
      </div>`).join("") + `</div>`).join("");
}

function chartView(rows) {
  if (!rows.length) return `<div class="empty">Nothing measured yet.<br>
    <span class="envnote">Only files that were processed carry before and after levels.
    Files skipped because they already have a stereo track never get measured.</span></div>`;
  const W = 900, PAD = 34;
  // Give every row room to breathe; 68 files in 300px is 4px each.
  const H = Math.max(320, rows.length * 9 + PAD * 2);
  const ins = rows.map(r => r.input_i), outs = rows.map(r => r.output_i);
  let lo = Math.floor(Math.min(...ins, ...outs) - 1), hi = Math.ceil(Math.max(...ins, ...outs) + 1);
  if (hi <= lo) hi = lo + 1;   // a single value would divide by zero below
  const x = v => PAD + (v - lo) / (hi - lo) * (W - PAD * 2);
  const y = i => PAD + i / Math.max(rows.length - 1, 1) * (H - PAD * 2);
  const ticks = [];
  for (let v = lo; v <= hi; v += 4) ticks.push(v);
  return `<div style="padding:16px">
    <div class="envnote" style="margin-bottom:8px">Each row is one file: left dot is the source after downmix, right dot is the result. Target is ${esc(String(TARGET))} LUFS.</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
         preserveAspectRatio="xMidYMid meet"
         style="max-width:100%;height:auto;display:block">
      ${ticks.map(v => `<line x1="${x(v)}" y1="${PAD - 8}" x2="${x(v)}" y2="${H - PAD}" stroke="hsl(225 14% 24%)"/>
                        <text x="${x(v)}" y="${H - PAD + 14}" text-anchor="middle">${v}</text>`).join("")}
      <line x1="${x(TARGET)}" y1="${PAD - 8}" x2="${x(TARGET)}" y2="${H - PAD}" stroke="hsl(25 89% 62%)" stroke-dasharray="4 3"/>
      ${rows.map((r, i) => {
        const gain = (r.output_i - r.input_i).toFixed(1);
        const lo = Math.min(r.input_i, r.output_i), hi = Math.max(r.input_i, r.output_i);
        const tip = `${r.name}\nsource ${num(r.input_i)} LUFS, result ${num(r.output_i)} LUFS\n`
                  + `range ${num(lo)} to ${num(hi)}, gain ${gain > 0 ? "+" : ""}${gain} dB`
                  + `${r.source_lang ? `\nlanguage ${r.source_lang}` : ""}`;
        const band = (H - PAD * 2) / Math.max(rows.length, 1);
        return `<g><title>${esc(tip)}</title>
          <rect class="hitrow" x="${PAD}" y="${y(i) - band / 2}" width="${W - PAD * 2}" height="${band}"/>
          <line class="rowline" x1="${x(r.input_i)}" y1="${y(i)}" x2="${x(r.output_i)}" y2="${y(i)}"
                stroke="${r.output_i > r.input_i ? "hsl(145 45% 40%)" : "hsl(359 55% 45%)"}" stroke-width="1.4"/>
          <circle cx="${x(r.input_i)}" cy="${y(i)}" r="2" fill="hsl(225 10% 55%)"/>
          <circle cx="${x(r.output_i)}" cy="${y(i)}" r="2.6" fill="hsl(25 89% 62%)"/></g>`;
      }).join("")}
    </svg></div>`;
}

let TARGET = -16;

async function saveSetting(key) {
  const el = document.getElementById("set-" + key);
  const v = el.dataset.bool ? (el.checked ? "true" : "false") : el.value;
  const r = await fetch("/api/settings", {method: "PUT", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({[key]: v === "" ? null : v})});
  banner(r.ok ? `saved ${key}` : `failed to save ${key}`);
  loadTable(); loadStatus();
}
async function resetSetting(key) {
  await fetch("/api/settings", {method: "PUT", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({[key]: null})});
  banner(`${key} reset to the compose value`); loadTable(); loadStatus();
}
async function reprocess(path) {
  const r = await fetch(`/api/files/${path.replace(/^\//, "")}/reprocess`, {method: "POST"});
  banner(r.ok ? "queued for reprocessing" : "could not queue that file"); loadTable();
}
async function exclude(path, on) {
  await fetch(`/api/files/${path.replace(/^\//, "")}`, {method: "PUT",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({excluded: !!on})});
  banner(on ? "excluded" : "included again"); loadTable();
}
function banner(msg) {
  $("banner").innerHTML = `<div class="banner">${esc(msg)}</div>`;
  setTimeout(() => ($("banner").innerHTML = ""), 4000);
}

async function loadTable() {
  const q = encodeURIComponent($("q").value || "");
  const box = $("table").parentElement;
  box.classList.toggle("free", view === "settings" || view === "chart");
  $("q").style.display = (view === "files") ? "" : "none";
  if (view === "settings") {
    const rows = await get("/api/settings");
    $("table").innerHTML = settingsView(rows);
    $("foot").textContent = "Values shown are overrides stored in the database. The placeholder is what docker-compose.yml declares.";
    return;
  }
  if (view === "chart") {
    const rows = await get("/api/chart");
    $("table").innerHTML = chartView(rows);
    const sum = await get("/api/summary");
    const total = sum.done + sum.eligible + sum.skipped + sum.failed;
    $("foot").textContent = `${rows.length} measured of ${total} catalogued. `
      + `Skipped files (${sum.skipped}) are not measured, so they do not appear here.`;
    return;
  }
  if (view === "files") {
    const rows = await get("/api/files?limit=1000&q=" + q);
    $("table").innerHTML = filesTable(rows);
    $("foot").textContent = rows.length + " file(s) shown";
  } else {
    const rows = await get("/api/runs?limit=300");
    $("table").innerHTML = runsTable(rows);
    $("foot").textContent = rows.length + " run(s) shown";
  }
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  view = b.dataset.view;
  loadTable();
});
let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(loadTable, 250); };

$("home").onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  document.querySelector('nav button[data-view="files"]').classList.add("on");
  view = "files"; loadTable();
};
$("btn-scan").onclick = async () => { await fetch("/api/scan", {method: "POST"}); banner("scan started"); };
$("btn-retry").onclick = async () => {
  const r = await (await fetch("/api/retry-failed", {method: "POST"})).json();
  banner(`requeued ${r.requeued} failed file(s)`); loadTable();
};
$("btn-pause").onclick = async () => {
  const paused = $("btn-pause").textContent === "Pause";
  await fetch("/api/settings", {method: "PUT", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({paused: paused ? "true" : "false"})});
  banner(paused ? "worker paused" : "worker resumed"); loadStatus();
};

loadSummary(); loadStatus(); loadTable();
setInterval(loadStatus, 5000);
setInterval(loadSummary, 30000);
setInterval(() => { if (view !== "settings") loadTable(); }, 30000);
</script>
</body>
</html>
