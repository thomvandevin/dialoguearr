name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff -r requirements.txt
      - run: ruff check .
      - name: Import check
        run: python -c "import db, normalize, app, main"
        env:
          PLEX_URL: ""
      - name: Check the page script parses
        # A broken script still serves HTTP 200, so the smoke test cannot see it.
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("templates/index.html").read_text()
          pathlib.Path("/tmp/page.js").write_text(re.search(r"<script>(.*?)</script>", html, re.S).group(1))
          PY
          node --check /tmp/page.js

  smoke:
    # The image built fine while missing a module, because nothing ever ran it.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dialoguearr:smoke .
      - name: Boot the image and check it serves
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e DB_PATH=/tmp/smoke.db -e MEDIA_PATH=/tmp -e PLEX_URL= \
            dialoguearr:smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          echo "--- endpoints ---"
          for ep in /healthz /api/summary /api/status /api/settings /api/files /api/runs /api/chart; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$ep")
            echo "  $ep -> $code"
            [ "$code" = "200" ] || { docker logs smoke; exit 1; }
          done
          curl -fsS http://localhost:8080/ | grep -q "<title>dialoguearr</title>" || exit 1
          docker logs smoke 2>&1 | grep -iE "Traceback|ModuleNotFound|Error" && exit 1
          echo "smoke test passed"

  build:
    needs: [lint, smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture; cross-building an ffmpeg image
          # under QEMU is an order of magnitude slower.
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Save digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo -n "" > "/tmp/digests/$(echo '${{ steps.build.outputs.digest }}' | sed 's|sha256:||')"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
